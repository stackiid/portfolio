<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="docTitle docDesc">
  <title id="docTitle">Sample document placeholder</title>
  <desc id="docDesc">Placeholder artwork standing in for a real internship certificate image. Replace the file at assets/documents/ and update documentPath in collaboration-config.js.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#242018" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f0d896" />
    </linearGradient>
  </defs>

  <rect width="900" height="640" fill="url(#bg)" />
  <rect x="24" y="24" width="852" height="592" fill="none" stroke="url(#gold)" stroke-width="2" />
  <rect x="40" y="40" width="820" height="560" fill="none" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1" />

  <circle cx="450" cy="150" r="42" fill="none" stroke="url(#gold)" stroke-width="3" />
  <path d="M432 150 l12 12 l24 -26" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <text x="450" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#f0d896" letter-spacing="2">
    CERTIFICATE OF INTERNSHIP
  </text>
  <text x="450" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#e8e8e8" fill-opacity="0.55" letter-spacing="1">
    SAMPLE PLACEHOLDER &#8212; REPLACE WITH THE REAL DOCUMENT
  </text>

  <line x1="300" y1="330" x2="600" y2="330" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1" />

  <text x="450" y="380" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#e8e8e8">
    Awarded to
  </text>
  <text x="450" y="424" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#f0d896">
    Ubaid Ahmad
  </text>
  <text x="450" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#e8e8e8" fill-opacity="0.65">
    For contributions to frontend development &amp; UI/UX work at HerDev
  </text>

  <text x="450" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e8e8e8" fill-opacity="0.4" letter-spacing="1">
    assets/documents/herdev-internship-certificate-placeholder.svg
  </text>
</svg>
